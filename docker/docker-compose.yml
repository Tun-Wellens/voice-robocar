version: '3.8'
services:
  voice-assistant:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: "host"       # Allows ROS 2 DDS to find the real Robocar
    ipc: host
    pid: host
    stdin_open: true           # For interactive input() (Push-to-Talk)
    tty: true                  # Works with stdin_open to allow live keyboard inputs
    group_add:
      - audio                   # Allows access to sound devices for STT/TTS
    env_file:
      - ../.env
    environment:
      - ROS_DOMAIN_ID=0        # Ensure this matches the physical Junior car
      - PULSE_SERVER=unix:/tmp/pulse-socket
      - PULSE_COOKIE=/root/.config/pulse/cookie
    devices:
      - "/dev/snd:/dev/snd"    # Passes ALSA sound card to the container for STT/TTS
    volumes:
      - ../.env:/workspace/.env
      - /run/user/1000/pulse/native:/tmp/pulse-socket
      - ~/.config/pulse/cookie:/root/.config/pulse/cookie:ro